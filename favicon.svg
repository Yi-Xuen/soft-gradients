<svg xmlns="http://www.w3.org/2000/svg" viewBox="6.5 7 50 50">
  <defs>
    <clipPath id="cloud">
      <circle cx="19" cy="39" r="10"/>
      <circle cx="31" cy="30" r="15"/>
      <circle cx="44" cy="37" r="11"/>
      <rect x="9" y="37" width="45" height="12" rx="6"/>
    </clipPath>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE6CC"/>
      <stop offset="1" stop-color="#8FB3DB"/>
    </linearGradient>
    <radialGradient id="rose" gradientUnits="userSpaceOnUse" cx="22" cy="44" r="24">
      <stop offset="0" stop-color="#F58FA9"/>
      <stop offset="1" stop-color="#F58FA9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" gradientUnits="userSpaceOnUse" cx="46" cy="24" r="22">
      <stop offset="0" stop-color="#A996EE"/>
      <stop offset="1" stop-color="#A996EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" gradientUnits="userSpaceOnUse" cx="20" cy="22" r="18">
      <stop offset="0" stop-color="#FFD38A"/>
      <stop offset="1" stop-color="#FFD38A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#cloud)">
    <rect width="64" height="64" fill="url(#base)"/>
    <rect width="64" height="64" fill="url(#violet)"/>
    <rect width="64" height="64" fill="url(#rose)"/>
    <rect width="64" height="64" fill="url(#sun)"/>
  </g>
</svg>
